<!DOCTYPE html>
<html lang="en">

<head>
    <title></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

</head>

<body>
    <script>
        const person = {
            name: "John",
            age: 30,
            city: "New York"
        };

        console.log(person.age)
        person.age = 22; // Modifying the age property
        console.log(person);
        console.log(person.age)


        person["city"] = "Paris"; // Modifying the city property using bracket notation
        console.log(person);
        console.log(person.city)


        let key = "name";
        person[key] = "Alice"; // Modifying the name property using a variable as the key
        console.log(person);
        console.log(person.name)


        //////////////////////////////////////////////////////////////////////

        const obj = {
            name: "Abc",
            age: 20,
            dob: "1997-03-14"
        }
        console.log(obj.dob)
        a = new Date(obj.dob);
        console.log(a)


        function test() {
            console.log(obj.dob)
            console.log(a)

            document.writeln(obj.dob)

            document.writeln(a)
        }


        

    </script>



    <button onclick="test()" style="border: 2px solid blue ; border-radius: 50%; height: 100px ; width: 100px; background-color: yellow;">click here</button>
</body>

</html>
