<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const student = [
            {
                name: "abc",
                age: 25
            },
            {
                name: "xyz",
                age: 67
            },
            {
                name: "liahu",
                age: 45
            }

        ]

        const a = student.sort((a,b)=> b.age-a.age)
        for(x of a){
            console.log(x.name + " " + x.age)
        }
    </script>
</body>
